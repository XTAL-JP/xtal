<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- iOS/Android のツールバーを暗色にして背景と馴染ませる -->
  <meta name="theme-color" content="#0a0503" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>XTAL — DJ / Producer, Nagano Japan</title>
  <meta name="description" content="XTAL — DJ and producer from Nagano, Japan. Links, biography, schedule and news." />

  <!-- OGP -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="XTAL — DJ / Producer, Nagano Japan" />
  <meta property="og:description" content="DJ and producer from Nagano, Japan." />
  <meta property="og:url" content="https://xtal-jp.com/" />
  <meta property="og:image" content="https://xtal-jp.com/assets/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="XTAL — DJ / Producer, Nagano Japan" />
  <meta name="twitter:description" content="DJ and producer from Nagano, Japan." />
  <meta name="twitter:image" content="https://xtal-jp.com/assets/og.jpg" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <!-- 英語フォント：見出し=Big Shoulders Display（インダストリアル）／本文=Barlow -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 背景：暖色系グラデーション（アクセス毎にランダム生成） -->
  <canvas id="bg" aria-hidden="true"></canvas>
  <!-- 可読性確保のためのごく薄い暗幕 -->
  <div class="scrim" aria-hidden="true"></div>

  <main class="wrap">
    <!-- ヒーロー -->
    <header class="hero">
      <h1 class="hero__name" id="name">XTAL</h1>
      <p class="hero__tagline" id="tagline">DJ / Producer</p>
    </header>

    <!-- ソーシャル導線 -->
    <nav class="links" id="socials" aria-label="Social links"></nav>

    <!-- Schedule -->
    <section class="section" id="schedule-section" aria-labelledby="schedule-heading">
      <h2 class="section__title" id="schedule-heading">Schedule</h2>
      <div id="schedule"></div>
    </section>

    <!-- Contact（Get in Touch） -->
    <section class="section" id="contact-section" aria-labelledby="contact-heading">
      <h2 class="section__title" id="contact-heading">Contact</h2>
      <div id="contact"></div>
    </section>

    <!-- 今プッシュしたいもの（Instagram投稿の埋め込み等） -->
    <div class="featured" id="featured" aria-label="Featured"></div>

    <!-- Discography -->
    <section class="section" id="disco-section" aria-labelledby="disco-heading">
      <h2 class="section__title" id="disco-heading">Discography</h2>
      <div id="discography"></div>
    </section>

    <!-- Biography -->
    <section class="section" id="bio-section" aria-labelledby="bio-heading">
      <h2 class="section__title" id="bio-heading">Biography</h2>
      <div class="bio" id="bio"></div>
    </section>

    <footer class="foot" id="foot"></footer>
  </main>

  <noscript>
    <div class="wrap"><p style="color:#f4f1ea">JavaScript を有効にすると、リンク・スケジュール・News が表示されます。</p></div>
  </noscript>

  <script src="background.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
