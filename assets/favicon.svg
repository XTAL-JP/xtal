<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- サイト背景（暖色の有機的グラデーション）を模したファビコン（かなり暗め） -->
  <defs>
    <clipPath id="clip"><rect width="64" height="64" rx="14"/></clipPath>
    <radialGradient id="f1" cx="28%" cy="26%" r="58%">
      <stop offset="0" stop-color="#b04a1f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b04a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f2" cx="78%" cy="58%" r="62%">
      <stop offset="0" stop-color="#8a5420" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8a5420" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f3" cx="46%" cy="92%" r="68%">
      <stop offset="0" stop-color="#6e1c11" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6e1c11" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f4" cx="88%" cy="16%" r="46%">
      <stop offset="0" stop-color="#b3823a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#b3823a" stop-opacity="0"/>
    </radialGradient>
