<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- サイト背景（暖色の有機的グラデーション）を模したファビコン（暗め） -->
  <defs>
    <clipPath id="clip"><rect width="64" height="64" rx="14"/></clipPath>
    <radialGradient id="f1" cx="28%" cy="26%" r="60%">
      <stop offset="0" stop-color="#e0602a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e0602a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f2" cx="78%" cy="58%" r="64%">
      <stop offset="0" stop-color="#c47a2e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c47a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f3" cx="46%" cy="92%" r="70%">
      <stop offset="0" stop-color="#a52a1a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a52a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f4" cx="88%" cy="16%" r="48%">
      <stop offset="0" stop-color="#e6a94d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e6a94d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f5" cx="14%" cy="82%" r="50%">
      <stop offset="0" stop-color="#3a0f08" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a0f08" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="64" height="64" fill="#0a0503"/>
    <rect width="64" height="64" fill="url(#f3)"/>
    <rect width="64" height="64" fill="url(#f5)"/>
    <rect width="64" height="64" fill="url(#f1)"/>
    <rect width="64" height="64" fill="url(#f2)"/>
    <rect width="64" height="64" fill="url(#f4)"/>
