    <radialGradient id="f1" cx="28%" cy="26%" r="62%">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff7a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f2" cx="78%" cy="58%" r="66%">
      <stop offset="0" stop-color="#ffb24d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb24d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f3" cx="46%" cy="92%" r="72%">
      <stop offset="0" stop-color="#e23c2a" stop-opacity="0.88"/>
